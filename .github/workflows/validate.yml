name: Validate plugin

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Validate metadata and source integrity
        run: python3 scripts/validate_plugin.py
      - name: Test packaging and upload projections
        run: python3 -m unittest discover -s tests -v
      - name: Build and round-trip the release archives
        run: python3 scripts/build_plugin.py
